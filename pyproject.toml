[project]
name = "stt-daemon"
version = "0.1.0"
description = "A local speech-to-text daemon: one mic, many clients, over a Unix socket"
authors = [
    { name = "AndreiD", email = "25061380+AndreiD108@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "sherpa-onnx==1.13.8",
    # Linux wheels need -core (onnxruntime), but uv reads sherpa-onnx's deps from wheels that omit it
    "sherpa-onnx-core==1.13.8",
    "sounddevice>=0.5.6",
    "websockets>=17.2",
]

[project.scripts]
stt-daemon = "stt_daemon.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: needs a real mic or a backend API key; run with -m live",
    "slow: runs a local model; skipped when it isn't installed",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
